<title>Smart Home – Intelligente Gebäudetechnik | motiv Recklinghausen</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --black:#101d32;
  --off-black:#162540;
  --white:#f5f0e8;
  --dim:rgba(245,240,232,.6);
  --gold:#c8a06a;
  --gold-a:rgba(200,160,106,.08);
  --gold-b:rgba(200,160,106,.15);
  --border:rgba(245,240,232,.09);
  --border2:rgba(245,240,232,.18);
  --ease:cubic-bezier(.16,1,.3,1);
  --ease2:cubic-bezier(.76,0,.24,1);
}
html{scroll-behavior:auto;cursor:none}
body{background:var(--black);color:var(--white);font-family:'Inter',sans-serif;overflow-x:hidden;-webkit-font-smoothing:antialiased}

/* ── NOISE ── */
#noise{position:fixed;inset:-200%;width:400%;height:400%;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.45'/%3E%3C/svg%3E");
  opacity:.025;pointer-events:none;z-index:9998;animation:noiseDrift 7s steps(8,end) infinite}
@keyframes noiseDrift{0%,100%{transform:translate(0,0)}10%{transform:translate(-5%,-5%)}50%{transform:translate(-3%,6%)}90%{transform:translate(-6%,1%)}}

/* ── CURSOR ── */
#cur,#cur2{position:fixed;border-radius:50%;pointer-events:none;z-index:9999;transform:translate(-50%,-50%)}
#cur{width:10px;height:10px;background:var(--white);z-index:10000;mix-blend-mode:difference}
#cur2{width:38px;height:38px;border:1px solid rgba(245,240,232,.3);background:transparent;transition:width .4s var(--ease),height .4s var(--ease),border-color .3s}
#cur.big{width:52px;height:52px}
#cur2.big{width:68px;height:68px;border-color:var(--gold)}

/* ── SCROLL BAR ── */
#scrollBar{position:fixed;top:0;left:0;height:2px;background:linear-gradient(to right,var(--gold),var(--white));z-index:9999;width:0;pointer-events:none}

/* ── NAV ── */
#mainNav{position:fixed;top:0;left:0;right:0;z-index:600;padding:26px 6vw;
  display:flex;align-items:center;justify-content:space-between;
  transition:background .4s,padding .4s,backdrop-filter .4s}
#mainNav.scrolled{background:rgba(6,10,20,.88);backdrop-filter:blur(20px);padding:16px 6vw;border-bottom:1px solid var(--border)}
.nav-logo{display:flex;align-items:center;text-decoration:none;flex-shrink:0}
.nav-logo img{height:80px;width:auto;opacity:1;transition:opacity .2s}
.nav-logo:hover img{opacity:1}
.nav-links{display:flex;gap:36px;list-style:none}
.nav-links a{font-size:11px;font-weight:400;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);text-decoration:none;transition:color .3s;cursor:none;position:relative}
.nav-links a::after{content:'';position:absolute;bottom:-3px;left:0;right:100%;height:1px;background:var(--gold);transition:right .3s var(--ease)}
.nav-links a:hover{color:var(--white)}
.nav-links a:hover::after{right:0}
.nav-links a.active{color:var(--white)}
.nav-links a.active::after{right:0}
.nav-btn{font-size:11px;font-weight:400;letter-spacing:.13em;text-transform:uppercase;color:var(--white);text-decoration:none;padding:11px 26px;border:1px solid var(--border2);border-radius:100px;cursor:none;transition:background .3s,color .3s,border-color .3s}
.nav-btn:hover{background:var(--white);color:var(--black);border-color:var(--white)}

/* ── HAMBURGER ── */
.nav-hamburger{display:none;flex-direction:column;gap:5px;cursor:pointer;padding:4px;background:none;border:none;outline:none;-webkit-appearance:none;appearance:none}
.nav-hamburger span{display:block;width:22px;height:1.5px;background:var(--white)}
.nav-mobile-menu{display:none;position:fixed;top:98px;left:0;right:0;background:rgba(6,10,20,.96);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);z-index:590;flex-direction:column;padding:20px 5vw 24px;gap:0;border-bottom:1px solid var(--border)}
.nav-mobile-menu.open{display:flex}
.nav-mobile-menu a{font-size:15px;font-weight:300;color:var(--dim);text-decoration:none;padding:14px 0;border-bottom:1px solid rgba(245,240,232,.06)}
.nav-mobile-menu a:last-child{border-bottom:none;color:var(--gold);margin-top:8px}

/* ── is-mobile nav ── */
html.is-mobile #mainNav{padding:14px 5vw!important;background:rgba(6,10,20,.75)!important;backdrop-filter:blur(12px)!important}
html.is-mobile #mainNav.scrolled{padding:12px 5vw!important}
html.is-mobile .nav-links,html.is-mobile .nav-btn{display:none!important}
html.is-mobile .nav-hamburger{display:flex!important}
html.is-mobile .nav-logo img{height:48px!important}

/* ── HERO ── */
.hero{position:relative;height:100svh;overflow:hidden;background:var(--black);display:flex;align-items:center}
.hero-bg{position:absolute;inset:0}
.hero-bg img{width:100%;height:100%;object-fit:cover;filter:brightness(.38) saturate(.9)}
.hero-overlay{position:absolute;inset:0;background:linear-gradient(to right,rgba(6,10,20,.92) 0%,rgba(6,10,20,.5) 50%,rgba(6,10,20,.1) 100%)}
.hero-content{position:relative;z-index:2;left:7vw;max-width:560px}
.hero-eyebrow{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.hero-eyebrow-bar{width:28px;height:1px;background:var(--gold);flex-shrink:0}
.hero-eyebrow-txt{font-size:9px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);font-weight:400}
.hero-title{font-family:'Cormorant Garamond',serif;font-size:clamp(52px,7.5vw,110px);font-weight:300;line-height:.93;letter-spacing:-.03em;color:var(--white);margin-bottom:24px}
.hero-title em{font-style:italic;color:var(--gold)}
.hero-sub{font-size:16px;font-weight:300;color:var(--dim);line-height:1.75;max-width:400px;margin-bottom:36px}
.hero-cta{display:inline-flex;align-items:center;gap:10px;padding:14px 32px;border:1px solid rgba(200,160,106,.6);color:var(--gold);font-size:11px;letter-spacing:.16em;text-transform:uppercase;text-decoration:none;transition:background .3s,border-color .3s}
.hero-cta:hover{background:rgba(200,160,106,.08);border-color:var(--gold)}
.hero-cta-arr{transition:transform .35s var(--ease)}
.hero-cta:hover .hero-cta-arr{transform:translateX(5px)}

/* statbar */
.hero-statbar{position:absolute;bottom:0;left:0;right:0;display:flex;border-top:1px solid var(--border);background:rgba(6,10,20,.75);backdrop-filter:blur(18px);z-index:3}
.h-stat{flex:1;padding:16px 24px;border-right:1px solid var(--border)}
.h-stat:last-child{border-right:none}
.h-stat-n{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:400;letter-spacing:-.02em;line-height:1;color:var(--white)}
.h-stat-l{font-size:9px;font-weight:300;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-top:4px}

/* scroll indicator */
.hero-scroll{position:absolute;bottom:80px;right:7vw;z-index:3;display:flex;flex-direction:column;align-items:center;gap:8px}
.hero-scroll-wire{width:1px;height:52px;background:rgba(245,240,232,.18);position:relative;overflow:hidden}
.hero-scroll-wire::after{content:'';position:absolute;top:-100%;left:0;width:100%;height:100%;background:var(--gold);animation:wirePulse 2.2s var(--ease2) infinite}
@keyframes wirePulse{0%{top:-100%}100%{top:200%}}
.hero-scroll-lbl{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);writing-mode:vertical-rl}

/* mobile hero */
html.is-mobile .hero-content{left:5vw;right:5vw;max-width:none;top:76px;position:absolute}
html.is-mobile .hero-title{font-size:clamp(38px,9vw,52px)!important}
html.is-mobile .hero-sub{font-size:13px!important;max-width:none!important;margin-bottom:24px!important}
html.is-mobile .hero-statbar{display:none!important}
html.is-mobile .hero-scroll{display:none!important}
html.is-mobile .hero-overlay{background:linear-gradient(180deg,rgba(6,10,20,.88) 0%,rgba(6,10,20,.5) 60%,rgba(6,10,20,.2) 100%)!important}

/* mobile CTA pinned bottom */
.hero-mobile-cta{display:none;position:absolute;bottom:28px;left:5vw;right:5vw;z-index:4}
.hero-mobile-cta a{display:block;padding:15px;border:1px solid rgba(200,160,106,.5);color:var(--gold);font-size:11px;letter-spacing:.18em;text-transform:uppercase;text-decoration:none;text-align:center;background:rgba(6,10,20,.45);backdrop-filter:blur(10px)}
html.is-mobile .hero-cta{display:none!important}
html.is-mobile .hero-mobile-cta{display:block!important}

/* ── REVEAL ── */
.rv{opacity:0;transform:translateY(26px);transition:opacity .9s var(--ease),transform .9s var(--ease)}
.rv.vis{opacity:1;transform:none}
.rv.d1{transition-delay:.12s}.rv.d2{transition-delay:.24s}.rv.d3{transition-delay:.36s}.rv.d4{transition-delay:.48s}

/* ── MARQUEE ── */
.marquee-wrap{padding:20px 0;background:var(--off-black);border-top:1px solid var(--border);border-bottom:1px solid var(--border);overflow:hidden}
.marquee-belt{display:flex;white-space:nowrap;animation:beltRoll 32s linear infinite}
@keyframes beltRoll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.m-item{display:inline-flex;align-items:center;gap:20px;padding:0 20px;font-size:10px;font-weight:400;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);flex-shrink:0}
.m-dot{width:3px;height:3px;background:var(--gold);border-radius:50%;flex-shrink:0}

/* ── INTRO SECTION ── */
.intro-sec{padding:130px 7vw 120px;background:var(--black);border-top:1px solid var(--border);position:relative;overflow:hidden}
.intro-bg-letter{position:absolute;right:-2vw;top:50%;transform:translateY(-50%);font-family:'Cormorant Garamond',serif;font-size:34vw;font-weight:300;color:rgba(200,160,106,.025);line-height:1;pointer-events:none;user-select:none;letter-spacing:-.05em}
.intro-inner{display:grid;grid-template-columns:1.1fr 1fr;gap:80px;align-items:center;position:relative;z-index:1}
.intro-eyebrow{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);display:flex;align-items:center;gap:14px;margin-bottom:24px}
.intro-eyebrow::before{content:'';width:28px;height:1px;background:var(--gold);opacity:.55}
.intro-title{font-family:'Cormorant Garamond',serif;font-size:clamp(42px,4.8vw,78px);font-weight:300;line-height:1.01;letter-spacing:-.035em;margin-bottom:28px}
.intro-title em{font-style:italic;color:var(--gold)}
.intro-rule{width:36px;height:1px;background:var(--gold);opacity:.4;margin-bottom:28px}
.intro-body{font-size:15px;line-height:1.85;color:var(--dim);font-weight:300;margin-bottom:36px;max-width:480px}
.intro-checks{list-style:none;display:flex;flex-direction:column;gap:16px}
.intro-check{display:flex;align-items:flex-start;gap:14px;font-size:14px;font-weight:300;color:var(--white);line-height:1.55}
.intro-ck{width:22px;height:22px;flex-shrink:0;margin-top:1px;border-radius:50%;border:1px solid rgba(200,160,106,.45);display:flex;align-items:center;justify-content:center}
.intro-ck svg{width:10px;height:10px;stroke:var(--gold);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* mosaic right */
.intro-mosaic{display:grid;grid-template-columns:1fr .6fr;grid-template-rows:1fr .52fr;gap:10px;height:520px}
.intro-img-a{grid-column:1;grid-row:1/3;position:relative;border-radius:22px;overflow:hidden}
.intro-img-b{grid-column:2;grid-row:1;position:relative;border-radius:22px;overflow:hidden}
.intro-img-c{grid-column:2;grid-row:2;position:relative;border-radius:22px;overflow:hidden}
.intro-mosaic img{width:100%;height:100%;object-fit:cover;display:block;filter:brightness(.8) saturate(.9);transition:transform 8s ease,filter .6s}
.intro-mosaic:hover img{transform:scale(1.04);filter:brightness(.92) saturate(1)}
.intro-img-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,10,20,.04) 0%,rgba(6,10,20,.6) 100%);z-index:1}
.intro-img-tag{position:absolute;bottom:12px;left:12px;z-index:3;background:rgba(10,10,8,.82);backdrop-filter:blur(14px);border:1px solid rgba(200,160,106,.22);border-radius:12px;padding:7px 11px}
.intro-img-tag-lbl{font-size:7px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:2px}
.intro-img-tag-val{font-size:11px;color:var(--white);font-weight:500}

@media(max-width:1100px){
  .intro-inner{grid-template-columns:1fr;gap:48px}
  .intro-bg-letter{display:none}
  .intro-mosaic{height:380px}
  .intro-body{max-width:none}
}
@media(max-width:900px){
  .intro-sec{padding:70px 5vw 60px}
  .intro-mosaic{height:300px;grid-template-columns:1fr .55fr}
}

/* ── TAHOMA SECTION ── */
.tahoma-sec{padding:120px 7vw 110px;background:var(--off-black);border-top:1px solid var(--border);position:relative;overflow:hidden}
.tahoma-orb{position:absolute;border-radius:50%;filter:blur(100px);pointer-events:none}
.tahoma-orb-1{width:600px;height:600px;top:-180px;right:-100px;background:radial-gradient(circle,rgba(200,160,106,.10),transparent 70%)}
.tahoma-orb-2{width:400px;height:400px;bottom:-120px;left:-80px;background:radial-gradient(circle,rgba(200,160,106,.07),transparent 70%)}
.tahoma-inner{position:relative;z-index:1;max-width:1300px;margin:0 auto}
.tahoma-head{text-align:center;margin-bottom:72px}
.tahoma-kicker{display:inline-flex;align-items:center;gap:10px;font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin-bottom:20px}
.tahoma-kicker::before,.tahoma-kicker::after{content:'';display:block;width:22px;height:1px;background:var(--gold);opacity:.5}
.tahoma-title{font-family:'Cormorant Garamond',serif;font-size:clamp(38px,4.5vw,72px);font-weight:300;line-height:.98;letter-spacing:-.03em;margin-bottom:18px}
.tahoma-title em{font-style:italic;color:var(--gold)}
.tahoma-sub{font-size:15px;font-weight:300;color:var(--dim);line-height:1.8;max-width:560px;margin:0 auto}
.tahoma-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;margin-top:56px}
.tahoma-card{padding:36px 28px 40px;background:rgba(245,240,232,.02);border:1px solid var(--border);position:relative;transition:background .4s,border-color .4s}
.tahoma-card:hover{background:rgba(200,160,106,.04);border-color:rgba(200,160,106,.2)}
.tahoma-card-num{font-family:'Cormorant Garamond',serif;font-size:48px;font-weight:300;color:rgba(200,160,106,.12);line-height:1;margin-bottom:20px;letter-spacing:-.02em}
.tahoma-icon{width:40px;height:40px;border-radius:10px;border:1px solid rgba(200,160,106,.2);background:var(--gold-a);display:flex;align-items:center;justify-content:center;margin-bottom:18px}
.tahoma-icon svg{width:18px;height:18px;fill:var(--gold)}
.tahoma-card-title{font-size:14px;font-weight:500;color:var(--white);margin-bottom:10px;letter-spacing:.02em}
.tahoma-card-body{font-size:13px;font-weight:300;color:var(--dim);line-height:1.7}
.tahoma-badge{display:inline-flex;align-items:center;gap:8px;margin-top:56px;padding:10px 22px;border:1px solid rgba(200,160,106,.25);border-radius:100px;background:var(--gold-a)}
.tahoma-badge-dot{width:6px;height:6px;border-radius:50%;background:var(--gold)}
.tahoma-badge span{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.tahoma-badge-wrap{text-align:center}

@media(max-width:1100px){.tahoma-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:900px){
  .tahoma-sec{padding:70px 5vw}
  .tahoma-grid{grid-template-columns:1fr;gap:2px}
  .tahoma-card{padding:28px 22px 32px}
}

/* ── USE CASES ── */
.uc-sec{padding:130px 7vw 120px;background:var(--black);border-top:1px solid var(--border);overflow:hidden}
.uc-head{margin-bottom:64px}
.uc-eyebrow{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);display:flex;align-items:center;gap:14px;margin-bottom:22px}
.uc-eyebrow::before{content:'';width:28px;height:1px;background:var(--gold);opacity:.55}
.uc-title{font-family:'Cormorant Garamond',serif;font-size:clamp(38px,4.8vw,74px);font-weight:300;line-height:1;letter-spacing:-.035em}
.uc-title em{font-style:italic;color:var(--gold)}
.uc-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:2px}
.uc-card{position:relative;overflow:hidden;min-height:340px;cursor:none}
.uc-card-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.35) saturate(.7);transition:transform 1.2s var(--ease),filter .8s}
.uc-card:hover .uc-card-img{transform:scale(1.06);filter:brightness(.45) saturate(.85)}
.uc-card-overlay{position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,rgba(6,10,20,.92) 100%)}
.uc-card-content{position:absolute;bottom:0;left:0;right:0;padding:32px 30px;z-index:2}
.uc-card-icon{width:44px;height:44px;border-radius:12px;background:var(--gold-a);border:1px solid rgba(200,160,106,.25);display:flex;align-items:center;justify-content:center;margin-bottom:16px}
.uc-card-icon svg{width:20px;height:20px;fill:var(--gold)}
.uc-card-num{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:8px;font-weight:400}
.uc-card-title{font-family:'Cormorant Garamond',serif;font-size:clamp(24px,2.6vw,36px);font-weight:300;color:var(--white);margin-bottom:10px;line-height:1.1}
.uc-card-body{font-size:13px;font-weight:300;color:var(--dim);line-height:1.65;max-width:360px}
.uc-card-tag{display:inline-flex;align-items:center;gap:6px;margin-top:16px;padding:5px 12px;border-radius:100px;border:1px solid rgba(200,160,106,.22);background:rgba(200,160,106,.06)}
.uc-card-tag span{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}

@media(max-width:900px){
  .uc-sec{padding:70px 5vw 60px}
  .uc-grid{grid-template-columns:1fr}
  .uc-card{min-height:280px}
  .uc-card-content{padding:24px 20px}
}

/* ── HOW IT WORKS ── */
.how-sec{padding:120px 7vw 110px;background:var(--off-black);border-top:1px solid var(--border);position:relative;overflow:hidden}
.how-inner{max-width:1300px;margin:0 auto;position:relative;z-index:1}
.how-head{display:grid;grid-template-columns:1fr 1fr;gap:80px;align-items:end;margin-bottom:72px}
.how-eyebrow{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);display:flex;align-items:center;gap:14px;margin-bottom:22px}
.how-eyebrow::before{content:'';width:28px;height:1px;background:var(--gold);opacity:.55}
.how-title{font-family:'Cormorant Garamond',serif;font-size:clamp(38px,4.5vw,70px);font-weight:300;line-height:1.02;letter-spacing:-.035em}
.how-title em{font-style:italic;color:var(--gold)}
.how-body{font-size:15px;font-weight:300;color:var(--dim);line-height:1.82;max-width:400px;align-self:end}
.how-steps{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.how-step{padding:44px 32px;background:rgba(245,240,232,.02);border:1px solid var(--border);position:relative;overflow:hidden;transition:background .4s,border-color .4s}
.how-step:hover{background:rgba(200,160,106,.04);border-color:rgba(200,160,106,.18)}

/* ── CURSOR ── */
(function(){
  const dot=$('cur'),ring=$('cur2');
  let rx=0,ry=0,mx=0,my=0;
  document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;dot.style.left=mx+'px';dot.style.top=my+'px';});
  (function loop(){rx+=(mx-rx)*.12;ry+=(my-ry)*.12;ring.style.left=rx+'px';ring.style.top=ry+'px';requestAnimationFrame(loop);})();
  document.querySelectorAll('a,button').forEach(el=>{
    el.addEventListener('mouseenter',()=>{dot.classList.add('big');ring.classList.add('big');});
    el.addEventListener('mouseleave',()=>{dot.classList.remove('big');ring.classList.remove('big');});
  });
})();

/* ── REVEAL ── */
(function(){
  const io=new IntersectionObserver(entries=>{
    entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('vis');io.unobserve(e.target);}});
  },{threshold:.1});
  document.querySelectorAll('.rv').forEach(el=>io.observe(el));
})();

/* ── HAMBURGER ── */
;(function(){
  var btn=$('navHamburger'),menu=$('navMobileMenu');
  if(!btn||!menu) return;
  btn.addEventListener('click',function(){menu.classList.toggle('open');});
  menu.querySelectorAll('a').forEach(function(a){
    a.addEventListener('click',function(){menu.classList.remove('open');});
  });
  document.addEventListener('click',function(e){
    if(!menu.contains(e.target)&&e.target!==btn&&!btn.contains(e.target)){
      menu.classList.remove('open');
    }
  });
})();

/* ── FAQ ACCORDION ── */
document.querySelectorAll('.faq-item').forEach(function(item){
  var btn=item.querySelector('.faq-q');
  btn.addEventListener('click',function(){
    var isOpen=item.classList.contains('open');
    document.querySelectorAll('.faq-item.open').forEach(function(o){
      o.classList.remove('open');
      o.querySelector('.faq-q').setAttribute('aria-expanded','false');
    });
    if(!isOpen){
      item.classList.add('open');
      btn.setAttribute('aria-expanded','true');
    }
  });
});

/* ── SMOOTH SCROLL FOR ANCHOR LINKS ── */
document.querySelectorAll('a[href^="#"]').forEach(function(a){
  a.addEventListener('click',function(e){
    var id=this.getAttribute('href').slice(1);
    var el=document.getElementById(id);
    if(el){e.preventDefault();el.scrollIntoView({behavior:'smooth'});}
  });
});
</script>
